name: "Manual Release"

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    name: Publish Release (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: 'macos'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            name: 'linux'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest'
            name: 'windows'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Frontend dependencies
        run: npm ci

      - name: Build & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'MonaPDFsa v__VERSION__'
          releaseBody: 'Cross-platform desktop release for Windows (.exe/.msi), macOS (.dmg/.app), and Linux (.deb/.AppImage).'
          releaseDraft: ${{ github.event.inputs.draft != false }}
          prerelease: ${{ github.event.inputs.prerelease == true }}
          args: ${{ matrix.args }}

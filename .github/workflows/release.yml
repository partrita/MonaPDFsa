name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Run Rust Core Tests
        run: cargo test -p monapdfsa-core

  publish-release:
    name: Publish Release (${{ matrix.name }})
    needs: test
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: 'macos'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            name: 'linux'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest'
            name: 'windows'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Frontend dependencies
        run: npm ci

      - name: Build & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}"
          releaseName: "MonaPDFsa ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}"
          releaseBody: "Cross-platform desktop release for Windows (.exe/.msi), macOS (.dmg/.app), and Linux (.deb/.AppImage)."
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == true }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == true }}
          args: ${{ matrix.args }}

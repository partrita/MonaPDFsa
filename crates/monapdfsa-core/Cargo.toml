[package]
name = "monapdfsa-core"
version = "0.1.0"
description = "Core PDF processing and structural redaction engine for MonaPDFsa"
edition = "2021"

[dependencies]
lopdf = "0.35"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "generate_sample"
path = "src/bin/generate_sample.rs"

[[bin]]
name = "redact_cli"
path = "src/bin/redact_cli.rs"

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App for PDF tool"
authors = ["deepthought"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "app"

[[bin]]
name = "app"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
monapdfsa-core = { path = "../crates/monapdfsa-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
lopdf = "0.35"
base64 = "0.22"
